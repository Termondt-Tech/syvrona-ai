# Direct dependencies live here. The installable, hash-pinned locks are generated from it:
#   requirements.txt      runtime image
#   requirements-dev.txt  runtime + test tooling (the compose `test` image)
# Regenerate both with the command in CLAUDE.md ("Dependencies"). The lock takes nothing
# published in the seven days before it was cut, so a fresh release has time to be
# yanked before it reaches the image.

[project]
name = "syvrona"
version = "1.5.0.dev0"  # unreleased work after v1.4.8; the release tag decides the number
description = "Retired multi-provider AI chat workspace, published as an archive."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-docs", "THIRD_PARTY_LICENSES"]
requires-python = ">=3.13,<3.14"
dependencies = [
    # Web framework and extensions
    "Flask>=3.1.3,<4",
    "Flask-Login>=0.6.3",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Migrate>=4.1.0",
    "Flask-WTF>=1.3.0",
    "Flask-Limiter[redis]>=4.1.1,<5",
    "flask-hcaptcha>=0.7.2",
    # Persistence
    "SQLAlchemy>=2.1.6,<2.2",
    "PyMySQL[rsa]>=1.2.3",
    # Model providers: majors are capped so a new major is a deliberate, reviewed bump
    "openai>=3.41.0,<4",
    "anthropic>=2.3.0,<3",
    "google-genai>=2.34.0,<3",
    "tiktoken>=0.14.0",
    # Billing, mail, configuration, serving
    "stripe>=16.1.0,<17",
    "requests>=2.34.2",
    "python-dotenv>=1.2.4",
    "gunicorn>=26.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-flask>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Fail on deprecations raised by our own code, so legacy APIs cannot creep back.
    "error::DeprecationWarning:app.*",
]

[tool.black]
line-length = 88
exclude = '''
/(
    migrations
)/
'''
