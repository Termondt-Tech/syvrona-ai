name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'enhancement'
  - title: '🐛 Fixes'
    labels:
      - 'bug'
  - title: '📝 Documentation'
    labels:
      - 'documentation'
  - title: '🧰 Architecture & Refactor'
    labels:
      - 'architecture'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '- No changes'

template: |
  ## What's Changed

  $CHANGES

  **[Full Changelog](https://github.com/Termondt-Tech/syvrona-ai/compare/$PREVIOUS_TAG...$TAG)**
