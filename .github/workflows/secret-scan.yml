name: Secret Scan

# Scans the full git history (every branch and tag, merge diffs included) with
# gitleaks. Known false positives are listed in .gitleaksignore; current lines
# carry an inline `# gitleaks:allow`. Any other finding fails the job.
# Runs the gitleaks container directly: gitleaks-action needs a paid licence
# for organisation accounts. Both the action and the image are pinned by digest;
# bump them together with docs/git-history-secret-scan-2026-11-06.md.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 # v8.28.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo:ro "$GITLEAKS_IMAGE" \
            git /repo \
            --log-opts="--all -m" \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --no-banner --verbose --exit-code 1

      - name: Scan working tree
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo:ro "$GITLEAKS_IMAGE" \
            dir /repo \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --no-banner --verbose --exit-code 1
