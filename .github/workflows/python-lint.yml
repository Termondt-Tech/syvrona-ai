name: Python Lint

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"  # the image's interpreter (Dockerfile)

      - name: Install linters
        # Pinned so a new black or flake8 release cannot turn master red on its own.
        # Bump deliberately, reformat in the same commit, and update CLAUDE.md.
        run: pip install black==26.10.1 flake8==7.5.0

      - name: Run black
        run: black --check . --exclude '/migrations/'

      - name: Run flake8
        run: flake8 . --exclude=migrations
