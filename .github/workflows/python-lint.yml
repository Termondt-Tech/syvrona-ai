name: Python Lint

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        # Pinned so a new black or flake8 release cannot turn master red on its own.
        # Bump deliberately, reformat in the same commit, and update CLAUDE.md.
        run: pip install black==26.10.1 flake8==7.5.0

      - name: Run black
        run: black --check . --exclude '/migrations/'

      - name: Run flake8
        run: flake8 . --exclude=migrations
