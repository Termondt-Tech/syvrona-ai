{% extends "base.html" %}
{% block header %}
<title>Reset Password – Syvrona</title>
<meta name="description" content="Reset your Syvrona account password to regain access.">
<meta name="robots" content="noindex, nofollow">
{% endblock %}
{% block content %}
<main class="form-container">
    <h1 class="form-title">Forgot Password</h1>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <input class="input is-large" type="email" name="email" placeholder="Your Email" required autofocus>
        </div>
        <div class="form-actions">
            <button class="btn-primary" type="submit">Send Reset Link</button>
        </div>
    </form>
</main>
{% endblock %}
