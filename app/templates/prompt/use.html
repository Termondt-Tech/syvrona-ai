{% extends "prompt_module_base.html" %}

{% block module_content %}
    <h1 class="form-title">Refine Your Prompt</h1>
    {% include "_flash.html" %}
<div class="form-panel">
    <form action="{{ url_for('chat.chat_page') }}" method="POST" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="body">Edit your prompt before starting chat:</label>
            <textarea name="body" id="body" rows="14" style="resize:vertical; min-height:140px;"
                required>{{ prompt.body }}</textarea>
        </div>
        <div class="form-group">
            <label for="model">Choose model:</label>
            <select id="model" name="model">
                {% for model in available_models %}
                <option value="{{ model.key }}" {% if model.key==default_model %}selected{% endif %}>{{ model.display_name }}
                    ({{ model.provider|capitalize }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Start Chat</button>
            {# Uncomment below when ready for phase 2 #}
            {#
            <button type="submit" name="action" value="save" class="btn btn-secondary">Save Changes</button>
            <button type="submit" name="action" value="saveas" class="btn btn-secondary">Save As New</button>
            #}
        </div>
    </form>
    </div>

{% endblock %}
