{# templates/macros/tag_controls.html #}
{% macro tag_controls(tag_id, tag_name) %}
<div class="tag-actions">
    <button class="btn-action btn-rename" 
            aria-label="Rename tag" 
            data-tag-id="{{ tag_id }}" 
            data-tag-name="{{ tag_name }}"
            title="Rename tag">
        ✏️
    </button>
    <button class="btn-action btn-delete" 
            aria-label="Delete tag" 
            data-tag-id="{{ tag_id }}" 
            data-tag-name="{{ tag_name }}"
            title="Delete tag">
        🗑️
    </button>
</div>
{% endmacro %}
