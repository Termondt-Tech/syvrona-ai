{% extends "base.html" %}

{% block header %}
<title>Chat – Syvrona</title>
<meta name="robots" content="noindex, nofollow">
{% endblock %}


{% block content %}
<h1 class="main-title">Syvrona Chat</h1>
<main class="chat-container">
    <div id="body">
        {% for msg in messages %}
        <div class="{{ msg.role }}-message">
            <strong>{{ msg.role.capitalize() }}:</strong>
            <p>{{ msg.content }}</p>
        </div>
        {% endfor %}
    </div>
    <form id="chat-form">
        <div class="input-row">
            <textarea id="input" placeholder="Enter your message" rows="3"></textarea>
            <button type="submit" class="btn-primary">Send</button>
        </div>
    </form>
</main>
<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script>
    const form = document.querySelector('form');
    const input = document.getElementById('input');
    const body = document.getElementById('body');

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const userDiv = document.createElement("div");
        userDiv.className = "user-message";
        userDiv.innerHTML = marked.parse(input.value);
        body.appendChild(userDiv);
        body.scrollTop = body.scrollHeight;

        const response = await fetch("/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: input.value })
        });

        const reader = response.body.getReader();
        let output = "";
        const assistantDiv = document.createElement("div");
        assistantDiv.className = "assistant-message";
        body.appendChild(assistantDiv);

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = new TextDecoder().decode(value);
            output += chunk;
            assistantDiv.innerHTML = marked.parse(output);
            body.scrollTop = body.scrollHeight;
        }

        input.value = "";
    });
</script>

{% endblock %}
