{% extends "base.html" %}

{% block header %}
<title>Chat – Syvrona</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tags.css') }}">
{% endblock %}

{% block content %}
<h1 class="main-title">Syvrona Chat</h1>
<main class="chat-container">
    <div id="body">
        {% for msg in messages %}
        <div class="{{ msg.role }}-message" data-msg-id="{{ msg.id }}">
            <strong>{{ msg.role.capitalize() }}:</strong>
            <div class="msg-content" data-role="{{ msg.role }}">{{ msg.content }}</div>
            <span class="model-label">{{ msg.model }}</span>
            <div class="tag-list">
                {% for tag in msg.tags %}
                <span class="tag-pill" data-tag-id="{{ tag.id }}">
                    {{ tag.name }}
                    <span class="remove-tag" title="Remove tag">&times;</span>
                </span>
                {% endfor %}
                <span class="add-tag-btn" title="Add tag">+</span>
            </div>
            <input class="tag-input" type="text" placeholder="Add tag..." aria-label="Add tag" style="display:none;">
            <div class="tag-suggestions" style="display:none;"></div>
        </div>
        {% endfor %}
    </div>
    <form id="chat-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="conversation_id" value="{{ conversation_id }}">
        <div class="input-row">
            <textarea id="input" placeholder="Enter your message" rows="3">{{ prefilled_prompt }}</textarea>
            <div class="model-selector">
                <label for="model" class="visually-hidden">Model:</label>
                <select id="model" name="model" aria-label="Select AI Model">
                    {% for model in available_models %}
                    <option value="{{ model.key }}" {% if model.key==(selected_model or default_model) %}selected{%
                        endif %}>
                        {{ model.display_name }} ({{ model.provider|capitalize }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn-primary" id="send-btn">
                <span id="send-btn-label">Send</span>
                <span id="send-btn-spinner" style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"
                        style="vertical-align: middle;">
                        <circle cx="19" cy="19" r="16" stroke="#2563eb" stroke-width="4" opacity="0.35" />
                        <path d="M35 19a16 16 0 1 1-32 0" stroke="#2563eb" stroke-width="4">
                            <animateTransform attributeName="transform" type="rotate" from="0 19 19" to="360 19 19"
                                dur="1s" repeatCount="indefinite" />
                        </path>
                    </svg>
                </span>
            </button>

        </div>
    </form>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

</main>
<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/tags.js') }}"></script>
<script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('input');
    window.conversationId = "{{ conversation_id|default('') }}" ||
        document.querySelector('input[name="conversation_id"]')?.value || null;

    // --- Auto-expand textarea as you type ---
    input.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.max(this.scrollHeight, 44) + 'px';
    });
    function resetInputHeight() {
        input.style.height = 'auto';
        input.style.height = Math.max(input.scrollHeight, 44) + 'px';
    }

    const sendBtn = document.getElementById('send-btn');
    const body = document.getElementById('body');
    const modelSelector = document.getElementById('model');
    const AUTO_SUBMIT_ENABLED = true;

    // --- Scroll Helper ---
    function scrollChatToBottomAndFocus(smooth = false) {
        const lastMsg = body.lastElementChild;
        if (lastMsg) {
            lastMsg.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'end' });
        }
        if (input) input.focus();
    }

    // --- Toast Notification ---
    let toastTimeout;
    function showToast(msg, ms = 3500) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, ms);
        }
    }
    // --- Close toast on click ---
    document.getElementById('toast').addEventListener('click', function () {
        this.classList.remove('show');
    });

    // --- On page load: scroll to bottom ---
    window.addEventListener('DOMContentLoaded', () => {
        // --- Render all message markdown/code (delegated to marked.js) ---
        document.querySelectorAll('.msg-content').forEach(el => {
            const role = el.dataset.role;
            if (role === "assistant") {
                el.innerHTML = marked.parse(el.textContent);
            } else {
                const pre = document.createElement('pre');
                const code = document.createElement('code');
                code.textContent = el.textContent;
                pre.appendChild(code);
                el.innerHTML = '';
                el.appendChild(pre);
            }
        });

        // --- Scroll to bottom *after* rendering ---
        scrollChatToBottomAndFocus(false);
    });


    // --- Auto-submit if prefilled prompt ---
    if (AUTO_SUBMIT_ENABLED && input && input.value.trim()) {
        setTimeout(() => {
            if (document.body.contains(form) && input.value.trim() && !form.classList.contains('auto-submitted')) {
                form.classList.add('auto-submitted');
                form.requestSubmit();
            }
        }, 600);
    }

    // --- FORM SUBMIT: Handle User Message and Assistant Streaming ---
    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // --- Disable send button and show spinner ---
        const sendBtn = document.getElementById('send-btn');
        const sendBtnLabel = document.getElementById('send-btn-label');
        const sendBtnSpinner = document.getElementById('send-btn-spinner');
        sendBtn.disabled = true;
        sendBtnLabel.style.display = 'none';
        sendBtnSpinner.style.display = 'inline-block';

        const messageText = input.value;
        const selectedModel = modelSelector.value;
        input.value = "";
        resetInputHeight();

        // --- Add user message to DOM immediately ---
        const userDiv = document.createElement("div");
        userDiv.className = "user-message";
        userDiv.setAttribute('data-msg-id', 'pending-user');
        userDiv.innerHTML = `
            <strong>User:</strong>
            <div class="msg-content">${marked.parse(messageText)}</div>
            <span class="model-label">${selectedModel}</span>
            <div class="tag-list">
                <span class="add-tag-btn" title="Add tag">+</span>
            </div>
            <input class="tag-input" type="text" placeholder="Add tag..." aria-label="Add tag" style="display:none;">
            <div class="tag-suggestions" style="display:none;"></div>
        `;
        body.appendChild(userDiv);
        const userTagInput = userDiv.querySelector('.tag-input');
        if (userTagInput && window.SyvronaTags?.bindTagInput) {
            window.SyvronaTags.bindTagInput(userTagInput);
        }


        // --- Always create assistant div with spinner immediately ---
        const assistantDiv = document.createElement("div");
        assistantDiv.className = "assistant-message";
        assistantDiv.setAttribute('data-msg-id', 'pending-assistant');
        assistantDiv.innerHTML = `
            <strong>Assistant:</strong>
            <div class="msg-content">
                <span class="thinking-placeholder" style="opacity:0.8;">
                    <span class="thinking-spinner"></span>
                    <span class="thinking-text">Thinking</span>
                    <span class="thinking-dot dot1">.</span>
                    <span class="thinking-dot dot2">.</span>
                    <span class="thinking-dot dot3">.</span>
                </span>
            </div>
            <span class="model-label">${modelSelector.value}</span>
            <div class="tag-list">
                <span class="add-tag-btn" title="Add tag">+</span>
            </div>
            <input class="tag-input" type="text" placeholder="Add tag..." aria-label="Add tag" style="display:none;">
            <div class="tag-suggestions" style="display:none;"></div>
        `;
        body.appendChild(assistantDiv);
        const assistantTagInput = assistantDiv.querySelector('.tag-input');
        if (assistantTagInput && window.SyvronaTags?.bindTagInput) {
            window.SyvronaTags.bindTagInput(assistantTagInput);
        }

        scrollChatToBottomAndFocus();

        const assistantMsgContent = assistantDiv.querySelector('.msg-content');
        let firstTokenArrived = false;

        // --- Let browser paint spinner before fetch ---
        await new Promise(r => setTimeout(r, 0));

        try {
            // --- Post to backend and handle streaming response ---
            const response = await fetch("/answer", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRF-Token": window.csrf_token },
                body: JSON.stringify({
                    message: messageText,
                    model: selectedModel,
                    conversation_id: window.conversationId ? Number(window.conversationId) : null
                })
            });

            // -------- NEW: handle rate-limit burst (HTTP 429) ----------
            if (response.status === 429) {
                showToast("Too many requests – please wait a moment and try again.");
                return;            // bail early; no stream to read
            }
            // -------- NEW: handle token quota exceeded (HTTP 402) ----------
            else if (response.status === 402) {
                showToast("You hit your monthly token quota. Upgrade or wait for reset.");
                return;
            }


            const reader = response.body.getReader();
            let output = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = new TextDecoder().decode(value);
                output += chunk;
                // On first non-empty output, remove spinner only (not .msg-content)
                if (!firstTokenArrived && output.trim().length > 0) {
                    firstTokenArrived = true;
                    const spinner = assistantMsgContent.querySelector('.thinking-placeholder');
                    if (spinner) spinner.remove();
                }
                assistantMsgContent.innerHTML = marked.parse(output);
            }

            // After streaming: update CSRF token and message IDs
            const newToken = response.headers.get("X-CSRFToken");
            if (newToken) {
                window.csrf_token = newToken;
                document.querySelector('input[name="csrf_token"]').value = newToken;
            }
            const headerId = response.headers.get("X-Conversation-Id");
            if (headerId) {
                window.conversationId = headerId;
                document.querySelector('input[name="conversation_id"]').value = headerId;
            }

            await updateLatestMessages();

            input.focus();

            async function updateLatestMessages() {
                const resp = await fetch(`/conversation/${window.conversationId}/latest`);
                const latest = await resp.json();
                latest.forEach(msg => {
                    let selector = msg.role === "user" ? '[data-msg-id="pending-user"]' : '[data-msg-id="pending-assistant"]';
                    let div = document.querySelector(selector);
                    if (div) {
                        div.setAttribute('data-msg-id', msg.id);
                        const tagList = div.querySelector('.tag-list');
                        if (tagList) {
                            tagList.innerHTML =
                                msg.tags.map(
                                    tag => `<span class="tag-pill" data-tag-id="${tag.id}">${tag.name}<span class="remove-tag" title="Remove tag">&times;</span></span>`
                                ).join('') + `<span class="add-tag-btn" title="Add tag">+</span>`;
                        }
                    }
                });
            }
        } catch (err) {
            showToast("Failed to process request.");
        } finally {
            sendBtn.disabled = false;
            sendBtnLabel.style.display = '';
            sendBtnSpinner.style.display = 'none';
        }
    });
</script>
{% endblock %}
