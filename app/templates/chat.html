{% extends "base.html" %}

{% block header %}
<title>Chat – Syvrona</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
{% endblock %}


{% block content %}
<h1 class="main-title">Syvrona Chat</h1>
<main class="chat-container">
    <div id="body">
        {% for msg in messages %}
        <div class="{{ msg.role }}-message">
            <strong>{{ msg.role.capitalize() }}:</strong>
            <div class="msg-content">{{ msg.content }}</div>
            <span class="model-label">{{ msg.model }}</span>
        </div>
        {% endfor %}
    </div>
    <form id="chat-form">
        <div class="input-row">
            <textarea id="input" placeholder="Enter your message" rows="3"></textarea>
            <div class="model-selector">
                <label for="model" class="visually-hidden">Model:</label>
                <select id="model" name="model">
                    <option value="gpt-4.1" selected>GPT-4.1 (Default)</option>
                    <option value="gpt-4.1-mini">GPT-4.1 Mini</option>
                    <option value="gpt-4.1-nano">GPT-4.1 Nano</option>
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="gpt-4o-mini">GPT-4o Mini</option>
                    <option value="o3">OpenAI o3</option>
                    <option value="o3-mini">OpenAI o3 Mini</option>
                    <option value="o4-mini">OpenAI o4 Mini</option>
                    <option value="gpt-4.5">GPT-4.5</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    <option value="claude-sonnet-4-20250514">Claude Sonnet 4</option>
                    <option value="claude-opus-4-20250514">Claude Opus 4</option>
                    <option value="claude-3-7-sonnet-20250219">Claude Sonnet 3.7</option>
                    <option value="claude-3-5-sonnet-20241022">Claude Sonnet 3.5</option>
                    <option value="claude-3-5-haiku-20241022">Claude Haiku 3.5</option>
                    <option value="claude-3-haiku-20240307">Claude Haiku 3</option>
                    <option value="claude-3-opus-20240229">Claude Opus 3</option>
                </select>

            </div>
            <button type="submit" class="btn-primary">Send</button>
        </div>
    </form>
</main>
<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script>
    const form = document.querySelector('form');
    const input = document.getElementById('input');
    const body = document.getElementById('body');
    const modelSelector = document.getElementById('model');

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const userDiv = document.createElement("div");
        userDiv.className = "user-message";
        userDiv.innerHTML = `
            <strong>User:</strong>
            <div class="msg-content">${marked.parse(input.value)}</div>
            <span class="model-label">${modelSelector.value}</span>
            `;
        body.appendChild(userDiv);
        body.scrollTop = body.scrollHeight;

        const response = await fetch("/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: input.value, model: modelSelector.value })
        });

        const reader = response.body.getReader();
        let output = "";
        const assistantDiv = document.createElement("div");
        assistantDiv.className = "assistant-message";
        assistantDiv.innerHTML = `
            <strong>Assistant:</strong>
            <div class="msg-content"></div>
            <span class="model-label">${modelSelector.value}</span>
            `;
        body.appendChild(assistantDiv);

        const assistantMsgContent = assistantDiv.querySelector('.msg-content');


        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = new TextDecoder().decode(value);
            output += chunk;
            assistantMsgContent.innerHTML = marked.parse(output);
            body.scrollTop = body.scrollHeight;
        }

        input.value = "";
    });

    // Convert all previous message content from markdown to HTML
    document.querySelectorAll('.msg-content').forEach(el => {
        el.innerHTML = marked.parse(el.textContent);
    });

</script>

{% endblock %}
