{% extends "base.html" %}

{% block header %}
<title>Chat – Syvrona</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tags.css') }}">
{% endblock %}

{% block content %}
<h1 class="main-title">Syvrona Chat</h1>
<main class="chat-container">
    <div id="body">
        {% for msg in messages %}
        <div class="{{ msg.role }}-message" data-msg-id="{{ msg.id }}">
            <strong>{{ msg.role.capitalize() }}:</strong>
            <div class="msg-content" data-role="{{ msg.role }}">{{ msg.content }}</div>
            <span class="model-label">{{ msg.model }}</span>
            <div class="tag-list">
                {% for tag in msg.tags %}
                <span class="tag-pill" data-tag-id="{{ tag.id }}">
                    {{ tag.name }}
                    <span class="remove-tag" title="Remove tag">&times;</span>
                </span>
                {% endfor %}
                <span class="add-tag-btn" title="Add tag">+</span>
            </div>
            <input class="tag-input" type="text" placeholder="Add tag..." aria-label="Add tag" style="display:none;">
            <div class="tag-suggestions" style="display:none;"></div>
        </div>
        {% endfor %}
    </div>
    <form id="chat-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="conversation_id" value="{{ conversation_id }}">
        <div class="input-row">
            <textarea id="input" placeholder="Enter your message" rows="3">{{ prefilled_prompt }}</textarea>
            <div class="model-selector">
                <label for="model" class="visually-hidden">Model:</label>
                <select id="model" name="model" aria-label="Select AI Model">
                    {% for model in available_models %}
                    <option value="{{ model.key }}" {% if model.key==(selected_model or default_model) %}selected{%
                        endif %}>
                        {{ model.display_name }} ({{ model.provider|capitalize }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn-primary" id="send-btn">
                <span id="send-btn-label">Send</span>
                <span id="send-btn-spinner" style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"
                        style="vertical-align: middle;">
                        <circle cx="19" cy="19" r="16" stroke="#2563eb" stroke-width="4" opacity="0.35" />
                        <path d="M35 19a16 16 0 1 1-32 0" stroke="#2563eb" stroke-width="4">
                            <animateTransform attributeName="transform" type="rotate" from="0 19 19" to="360 19 19"
                                dur="1s" repeatCount="indefinite" />
                        </path>
                    </svg>
                </span>
            </button>

        </div>
    </form>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

</main>
<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('input');
    window.conversationId = "{{ conversation_id|default('') }}" ||
        document.querySelector('input[name="conversation_id"]')?.value || null;

    // --- Auto-expand textarea as you type ---
    input.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.max(this.scrollHeight, 44) + 'px';
    });

    function resetInputHeight() {
        input.style.height = 'auto';
        input.style.height = Math.max(input.scrollHeight, 44) + 'px';
    }


    const sendBtn = document.getElementById('send-btn');

    const body = document.getElementById('body');
    const modelSelector = document.getElementById('model');
    const AUTO_SUBMIT_ENABLED = true;

    // --- Scroll Helper ---
    function scrollChatToBottomAndFocus(smooth = false) {
        const lastMsg = body.lastElementChild;
        if (lastMsg) {
            lastMsg.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'end' });
        }
        if (input) input.focus();
    }

    // --- Toast Notification ---
    let toastTimeout;
    function showToast(msg, ms = 3500) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, ms);
        }
    }
    // --- Toast click to dismiss ---
    document.getElementById('toast').addEventListener('click', function () {
        this.classList.remove('show');
    });

    // --- On page load: scroll to bottom ---
    window.addEventListener('DOMContentLoaded', () => {
        scrollChatToBottomAndFocus(false);
    });

    // --- Auto-submit if prefilled prompt ---
    if (AUTO_SUBMIT_ENABLED && input && input.value.trim()) {
        setTimeout(() => {
            if (document.body.contains(form) && input.value.trim() && !form.classList.contains('auto-submitted')) {
                form.classList.add('auto-submitted');
                form.requestSubmit();
            }
        }, 600);
    }

    // --- Markdown/Code rendering ---
    function renderMsgContent(role, text) {
        if (role === "assistant") {
            return marked.parse(text);
        } else {
            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.textContent = text;
            pre.appendChild(code);
            return pre.outerHTML;
        }
    }

    // --- Tag controls and helpers ---
    function getTagUIMarkup(msgId, tags = []) {
        let pills = tags.map(tag => `
        <span class="tag-pill" data-tag-id="${tag.id}">
            ${tag.name}
            <span class="remove-tag" title="Remove tag">&times;</span>
        </span>
    `).join('');
        return `
        <div class="tag-list">
            ${pills}
            <span class="add-tag-btn" title="Add tag">+</span>
        </div>
        <input class="tag-input" type="text" placeholder="Add tag..." style="display:none;">
        <div class="tag-suggestions" style="display:none;"></div>
    `;
    }

    function ensureSuggestionsVisible(input, suggestionsDiv) {
        if (!suggestionsDiv || suggestionsDiv.style.display === 'none') return;

        // Reset previous flipping
        suggestionsDiv.style.bottom = '';
        suggestionsDiv.style.top = '';
        suggestionsDiv.style.maxHeight = '';

        // DOM context
        const chatBody = document.getElementById('body');
        const form = document.getElementById('chat-form');
        const inputRect = input.getBoundingClientRect();
        const sugRect = suggestionsDiv.getBoundingClientRect();
        const formRect = form.getBoundingClientRect();

        // Check if last message in chat
        const isLastMsg = input.closest('[data-msg-id]') === chatBody.querySelector('[data-msg-id]:last-of-type');

        // Space below input (to top of form)
        const spaceBelow = formRect.top - inputRect.bottom;

        // If suggestions overflow below chat form, flip up if there's room
        if (sugRect.bottom > formRect.top) {
            const flipHeight = sugRect.height || 180;
            // If enough space above input, flip suggestions up
            if (inputRect.top > flipHeight + 12) {
                suggestionsDiv.style.top = 'auto';
                suggestionsDiv.style.bottom = `110%`;
                suggestionsDiv.style.maxHeight = `${inputRect.top - 12}px`;
            } else {
                // Otherwise, just shrink
                suggestionsDiv.style.maxHeight = `${formRect.top - inputRect.bottom - 8}px`;
            }
        } else {
            // Normal display
            suggestionsDiv.style.top = '';
            suggestionsDiv.style.bottom = '';
            suggestionsDiv.style.maxHeight = '';
        }

        // --- Auto-scroll only if it's the last message and suggestions are clipped ---
        if (isLastMsg && sugRect.bottom > formRect.top) {
            // Calculate needed scroll adjustment
            const scrollDelta = sugRect.bottom - formRect.top + 8; // 8px margin
            chatBody.scrollTop = chatBody.scrollTop + scrollDelta;
        }
    }

    function bindTagInput(input) {
        const msgDiv = input.closest('[data-msg-id]');
        const suggestionsDiv = msgDiv.querySelector('.tag-suggestions');
        let suggestionIdx = -1;

        function highlightSuggestion(idx) {
            const suggestions = suggestionsDiv.querySelectorAll('.tag-suggestion-item');
            suggestions.forEach((item, i) => {
                item.classList.toggle('active', i === idx);
            });
        }

        input.addEventListener('input', async function () {
            const q = input.value;
            suggestionIdx = -1;
            if (!q) {
                suggestionsDiv.style.display = 'none';
                suggestionsDiv.innerHTML = '';
                return;
            }
            const resp = await fetch(`/tags/?q=${encodeURIComponent(q)}`);
            const tags = await resp.json();
            suggestionsDiv.innerHTML = '';
            if (tags.length === 0) {
                suggestionsDiv.style.display = 'none';
                return;
            }
            tags.forEach((tag, idx) => {
                const item = document.createElement('div');
                item.className = 'tag-suggestion-item';
                item.textContent = tag.name;
                item.tabIndex = -1;
                item.addEventListener('mousedown', async (e) => {
                    e.preventDefault();
                    await addTagToMessage(msgDiv, tag.name, input, suggestionsDiv);
                });
                suggestionsDiv.appendChild(item);
            });
            suggestionsDiv.style.display = 'block';
            ensureSuggestionsVisible(input, suggestionsDiv);
        });

        input.addEventListener('keydown', async function (e) {
            const suggestions = suggestionsDiv.querySelectorAll('.tag-suggestion-item');
            if ((e.key === 'ArrowDown' || e.key === 'Tab') && suggestions.length > 0) {
                e.preventDefault();
                suggestionIdx = (suggestionIdx + 1) % suggestions.length;
                highlightSuggestion(suggestionIdx);
                input.value = suggestions[suggestionIdx].textContent;
            } else if (e.key === 'ArrowUp' && suggestions.length > 0) {
                e.preventDefault();
                suggestionIdx = (suggestionIdx - 1 + suggestions.length) % suggestions.length;
                highlightSuggestion(suggestionIdx);
                input.value = suggestions[suggestionIdx].textContent;
            } else if (e.key === 'Enter') {
                if (suggestionIdx >= 0 && suggestions[suggestionIdx]) {
                    e.preventDefault();
                    await addTagToMessage(msgDiv, suggestions[suggestionIdx].textContent, input, suggestionsDiv);
                    suggestionIdx = -1;
                } else if (input.value.trim()) {
                    e.preventDefault();
                    await addTagToMessage(msgDiv, input.value.trim(), input, suggestionsDiv);
                    suggestionIdx = -1;
                }
            } else if (e.key === 'Escape') {
                // Hide and clear suggestions
                suggestionsDiv.style.display = 'none';
                suggestionsDiv.innerHTML = '';
                suggestionIdx = -1;
                input.value = '';
                // Hide and blur the input
                input.style.display = 'none';
                input.blur();
            }
            ensureSuggestionsVisible(input, suggestionsDiv);
        });
        input.addEventListener('blur', () => {
            // Only hide if not focused on suggestions (optional, but usually ok)
            setTimeout(() => {
                input.value = '';
                input.style.display = 'none';
                // Optionally: hide suggestions too
                suggestionsDiv.style.display = 'none';
                suggestionsDiv.innerHTML = '';
            }, 100);
        });

    }


    async function addTagToMessage(msgDiv, tagName, input, suggestionsDiv) {
        const msgId = msgDiv.dataset.msgId;
        const resp = await fetch(`/messages/${msgId}/tags`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': window.csrf_token },
            body: JSON.stringify({ tag: tagName })
        });
        if (resp.ok) {
            const data = await resp.json();
            const tagList = msgDiv.querySelector('.tag-list');
            const span = document.createElement('span');
            span.className = 'tag-pill';
            span.dataset.tagId = data.tag.id;
            span.innerHTML = `
            ${data.tag.name}
            <span class="remove-tag" title="Remove tag">&times;</span>
        `;
            const addBtn = tagList.querySelector('.add-tag-btn');
            tagList.insertBefore(span, addBtn);
            if (input) input.value = '';
            if (suggestionsDiv) {
                suggestionsDiv.innerHTML = '';
                suggestionsDiv.style.display = 'none';
            }
        }
        else {
            showToast("Failed to add tag.");
        }
    }

    // --- Tag event delegation ---
    body.addEventListener('click', function (e) {
        if (e.target.classList.contains('add-tag-btn')) {
            const container = e.target.closest('.tag-list');
            const input = container.parentElement.querySelector('.tag-input');
            input.style.display = 'inline-block';
            input.focus();
        }

        if (e.target.classList.contains('remove-tag')) {
            const tagSpan = e.target.closest('.tag-pill');
            const tagId = tagSpan.dataset.tagId;
            const msgDiv = tagSpan.closest('[data-msg-id]');
            const msgId = msgDiv.dataset.msgId;
            fetch(`/messages/${msgId}/tags/${tagId}`, {
                method: 'DELETE',
                headers: { 'X-CSRF-Token': window.csrf_token }
            }).then(() => tagSpan.remove());
        }
    });

    // --- Tag input setup for all tag inputs on load ---
    document.querySelectorAll('.tag-input').forEach(bindTagInput);

    // --- Render initial messages ---
    document.querySelectorAll('.msg-content').forEach(el => {
        const role = el.dataset.role;
        el.innerHTML = renderMsgContent(role, el.textContent);
    });

    // --- FORM SUBMIT: Handle User Message and Assistant Streaming ---
    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // --- Disable send button and show spinner ---
        const sendBtn = document.getElementById('send-btn');
        const sendBtnLabel = document.getElementById('send-btn-label');
        const sendBtnSpinner = document.getElementById('send-btn-spinner');
        sendBtn.disabled = true;
        sendBtnLabel.style.display = 'none';
        sendBtnSpinner.style.display = 'inline-block';

        const messageText = input.value;
        const selectedModel = modelSelector.value;
        input.value = "";
        resetInputHeight();

        // Add user message
        const userDiv = document.createElement("div");
        userDiv.className = "user-message";
        userDiv.setAttribute('data-msg-id', 'pending-user');
        userDiv.innerHTML = `
        <strong>User:</strong>
        <div class="msg-content">${renderMsgContent('user', messageText)}</div>
        <span class="model-label">${selectedModel}</span>
        ${getTagUIMarkup('', [])}
    `;
        body.appendChild(userDiv);
        userDiv.querySelectorAll('.tag-input').forEach(bindTagInput);

        // Scroll to bottom after user message
        scrollChatToBottomAndFocus();
        try {
            // Post to backend and handle streaming response
            const response = await fetch("/answer", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRF-Token": window.csrf_token },
                body: JSON.stringify({ 
                    message: messageText, 
                    model: selectedModel, 
                    conversation_id: window.conversationId ? Number(window.conversationId) : null })
            });

            const reader = response.body.getReader();
            let output = "";
            const assistantDiv = document.createElement("div");
            assistantDiv.className = "assistant-message";
            assistantDiv.setAttribute('data-msg-id', 'pending-assistant');
            assistantDiv.innerHTML = `
            <strong>Assistant:</strong>
            <div class="msg-content"></div>
            <span class="model-label">${modelSelector.value}</span>
            ${getTagUIMarkup('', [])}
        `;
            body.appendChild(assistantDiv);
            assistantDiv.querySelectorAll('.tag-input').forEach(bindTagInput);

            const assistantMsgContent = assistantDiv.querySelector('.msg-content');
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = new TextDecoder().decode(value);
                output += chunk;
                assistantMsgContent.innerHTML = marked.parse(output);
                // NO auto-scroll during streaming, per UX spec.
            }

            // After streaming completes: update CSRF token and message IDs
            const newToken = response.headers.get("X-CSRFToken");
            if (newToken) {
                window.csrf_token = newToken;
                document.querySelector('input[name="csrf_token"]').value = newToken;
            }
            const headerId = response.headers.get("X-Conversation-Id");
            if (headerId) {
                window.conversationId = headerId;
                document.querySelector('input[name="conversation_id"]').value = headerId;
            }

            await updateLatestMessages();

            input.focus();

            async function updateLatestMessages() {
                const resp = await fetch(`/conversation/${window.conversationId}/latest`);
                const latest = await resp.json();
                latest.forEach(msg => {
                    let selector = msg.role === "user" ? '[data-msg-id="pending-user"]' : '[data-msg-id="pending-assistant"]';
                    let div = document.querySelector(selector);
                    if (div) {
                        div.setAttribute('data-msg-id', msg.id);
                        const tagList = div.querySelector('.tag-list');
                        if (tagList) {
                            tagList.innerHTML =
                                msg.tags.map(
                                    tag => `<span class="tag-pill" data-tag-id="${tag.id}">${tag.name}<span class="remove-tag" title="Remove tag">&times;</span></span>`
                                ).join('') + `<span class="add-tag-btn" title="Add tag">+</span>`;
                        }
                    }
                });

            }
        } catch (err) {
            showToast("Failed to process request.")
        } finally {
            sendBtn.disabled = false;
            sendBtnLabel.style.display = '';
            sendBtnSpinner.style.display = 'none';
        }


    });
</script>
{% endblock %}
