{% extends "base.html" %}

{% block header %}
<title>Chat – Syvrona</title>
<meta name="robots" content="noindex, nofollow">
{% endblock %}


{% block content %}
<h1 class="main-title">Syvrona Chat</h1>
<main class="chat-container">
    <pre id="body"></pre>
    <form id="chat-form">
        <div class="input-row">
            <textarea id="input" placeholder="Enter your message" rows="3"></textarea>
            <button type="submit" class="btn-primary">Send</button>
        </div>
    </form>
</main>
<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script>
    const form = document.querySelector('form');
    const input = document.getElementById('input');
    const body = document.getElementById('body');

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const response = await fetch("/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: input.value })
        });

        const reader = response.body.getReader();
        let output = "";

        while (true) {
            const { done, value } = await reader.read();
            console.log("Chunk received:", value); // DEBUG
            output += new TextDecoder().decode(value);
            body.innerHTML = marked.parse(output);

            if (done) {
                console.log("Stream complete"); // DEBUG
                return;
            }
        }

    })
</script>
{% endblock %}
