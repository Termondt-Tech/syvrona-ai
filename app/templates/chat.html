{% extends "base.html" %}

{% block header %}
<title>Chat – Syvrona</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
{% endblock %}


{% block content %}
<h1 class="main-title">Syvrona Chat</h1>
<main class="chat-container">
    <div id="body">
        {% for msg in messages %}
        <div class="{{ msg.role }}-message" data-msg-id="{{ msg.id }}">
            <strong>{{ msg.role.capitalize() }}:</strong>
            <div class="msg-content">{{ msg.content }}</div>
            <span class="model-label">{{ msg.model }}</span>
            <!-- Tag pills -->
            <div class="tag-list">
                {% for tag in msg.tags %}
                <span class="tag-pill" data-tag-id="{{ tag.id }}">
                    {{ tag.name }}
                    <span class="remove-tag" title="Remove tag">&times;</span>
                </span>
                {% endfor %}
                <span class="add-tag-btn" title="Add tag">+</span>
            </div>
            <input class="tag-input" type="text" placeholder="Add tag..." style="display:none;">
            <div class="tag-suggestions" style="display:none;"></div>
        </div>
        {% endfor %}
    </div>
    <form id="chat-form">
        <div class="input-row">
            <textarea id="input" placeholder="Enter your message" rows="3"></textarea>
            <div class="model-selector">
                <label for="model" class="visually-hidden">Model:</label>
                <select id="model" name="model">
                    <option value="gpt-4.1" selected>GPT-4.1 (Default)</option>
                    <option value="gpt-4.1-mini">GPT-4.1 Mini</option>
                    <option value="gpt-4.1-nano">GPT-4.1 Nano</option>
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="gpt-4o-mini">GPT-4o Mini</option>
                    <option value="o3">OpenAI o3</option>
                    <option value="o3-mini">OpenAI o3 Mini</option>
                    <option value="o4-mini">OpenAI o4 Mini</option>
                    <option value="gpt-4.5">GPT-4.5</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    <option value="claude-sonnet-4-20250514">Claude Sonnet 4</option>
                    <option value="claude-opus-4-20250514">Claude Opus 4</option>
                    <option value="claude-3-7-sonnet-20250219">Claude Sonnet 3.7</option>
                    <option value="claude-3-5-sonnet-20241022">Claude Sonnet 3.5</option>
                    <option value="claude-3-5-haiku-20241022">Claude Haiku 3.5</option>
                    <option value="claude-3-haiku-20240307">Claude Haiku 3</option>
                    <option value="claude-3-opus-20240229">Claude Opus 3</option>
                </select>

            </div>
            <button type="submit" class="btn-primary">Send</button>
        </div>
    </form>
</main>
<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script>
    const form = document.querySelector('form');
    const input = document.getElementById('input');
    const body = document.getElementById('body');
    const modelSelector = document.getElementById('model');

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const userDiv = document.createElement("div");
        userDiv.className = "user-message";
        userDiv.setAttribute('data-msg-id', 'pending-user');
        userDiv.innerHTML = `
            <strong>User:</strong>
            <div class="msg-content">${marked.parse(input.value)}</div>
            <span class="model-label">${modelSelector.value}</span>
            ${getTagUIMarkup('', [])}
            `;
        body.appendChild(userDiv);
        userDiv.querySelectorAll('.tag-input').forEach(bindTagInput);

        body.scrollTop = body.scrollHeight;

        const response = await fetch("/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: input.value, model: modelSelector.value })
        });

        // If conversationId is not already set:
        if (!window.conversationId) {
            // The header comes as a string, parse as needed
            const headerId = response.headers.get("X-Conversation-Id");
            if (headerId) window.conversationId = parseInt(headerId, 10);
        }

        const reader = response.body.getReader();
        let output = "";
        const assistantDiv = document.createElement("div");
        assistantDiv.className = "assistant-message";
        assistantDiv.setAttribute('data-msg-id', 'pending-assistant');
        assistantDiv.innerHTML = `
            <strong>Assistant:</strong>
            <div class="msg-content"></div>
            <span class="model-label">${modelSelector.value}</span>
            ${getTagUIMarkup('', [])}
            `;
        body.appendChild(assistantDiv);
        assistantDiv.querySelectorAll('.tag-input').forEach(bindTagInput);

        const assistantMsgContent = assistantDiv.querySelector('.msg-content');


        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = new TextDecoder().decode(value);
            output += chunk;
            assistantMsgContent.innerHTML = marked.parse(output);
            body.scrollTop = body.scrollHeight;
        }

        input.value = "";
        // After streaming completes...
        await updateLatestMessages();

        async function updateLatestMessages() {
            const resp = await fetch(`/conversation/${window.conversationId}/latest`);

            const latest = await resp.json();
            latest.forEach(msg => {
                // Find placeholder div
                let selector = msg.role === "user" ? '[data-msg-id="pending-user"]' : '[data-msg-id="pending-assistant"]';
                let div = document.querySelector(selector);
                if (div) {
                    div.setAttribute('data-msg-id', msg.id);
                    // Optionally, replace tag-list with fresh tag UI
                    const tagList = div.querySelector('.tag-list');
                    if (tagList) {
                        tagList.innerHTML =
                            msg.tags.map(
                                tag =>
                                    `<span class="tag-pill" data-tag-id="${tag.id}">${tag.name}<span class="remove-tag" title="Remove tag">&times;</span></span>`
                            ).join('') + `<span class="add-tag-btn" title="Add tag">+</span>`;
                    }
                }
            });
        }

    });

    // Convert all previous message content from markdown to HTML
    document.querySelectorAll('.msg-content').forEach(el => {
        el.innerHTML = marked.parse(el.textContent);
    });

    // Event delegation for add-tag-btn
    document.getElementById('body').addEventListener('click', function (e) {
        // Add Tag Button
        if (e.target.classList.contains('add-tag-btn')) {
            const container = e.target.closest('.tag-list');
            const input = container.parentElement.querySelector('.tag-input');
            input.style.display = 'inline-block';
            input.focus();
        }

        // Remove Tag Button
        if (e.target.classList.contains('remove-tag')) {
            const tagSpan = e.target.closest('.tag-pill');
            const tagId = tagSpan.dataset.tagId;
            const msgDiv = tagSpan.closest('[data-msg-id]');
            const msgId = msgDiv.dataset.msgId;
            fetch(`/messages/${msgId}/tags/${tagId}`, { method: 'DELETE' })
                .then(() => tagSpan.remove());
        }
    });

    // Tag Input: autocomplete & submit (delegate focus/blur if possible)
    document.querySelectorAll('.tag-input').forEach(input => {
        const msgDiv = input.closest('[data-msg-id]');
        const suggestionsDiv = msgDiv.querySelector('.tag-suggestions');
        input.addEventListener('input', async function () {
            const q = input.value;
            if (!q) {
                suggestionsDiv.style.display = 'none';
                suggestionsDiv.innerHTML = '';
                return;
            }
            const resp = await fetch(`/tags?q=${encodeURIComponent(q)}`);
            const tags = await resp.json();
            suggestionsDiv.innerHTML = '';
            if (tags.length === 0) {
                suggestionsDiv.style.display = 'none';
                return;
            }
            tags.forEach(tag => {
                const item = document.createElement('div');
                item.className = 'tag-suggestion-item';
                item.textContent = tag.name;
                item.addEventListener('click', async () => {
                    await addTagToMessage(msgDiv, tag.name, input, suggestionsDiv);
                });
                suggestionsDiv.appendChild(item);
            });
            suggestionsDiv.style.display = 'block';
        });

        input.addEventListener('keydown', async function (e) {
            if (e.key === 'Enter' && input.value.trim()) {
                e.preventDefault();
                await addTagToMessage(msgDiv, input.value.trim(), input, suggestionsDiv);
            }
        });

    });

    async function addTagToMessage(msgDiv, tagName, input, suggestionsDiv) {
        const msgId = msgDiv.dataset.msgId;
        const resp = await fetch(`/messages/${msgId}/tags`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tag: tagName })
        });
        if (resp.ok) {
            // Parse the response to get the new tag info
            const data = await resp.json();
            // Find the tag list container
            const tagList = msgDiv.querySelector('.tag-list');
            // Create the new tag pill element
            const span = document.createElement('span');
            span.className = 'tag-pill';
            span.dataset.tagId = data.tag.id;
            span.innerHTML = `
                ${data.tag.name}
                <span class="remove-tag" title="Remove tag">&times;</span>
            `;
            // Insert before the "+" button
            const addBtn = tagList.querySelector('.add-tag-btn');
            tagList.insertBefore(span, addBtn);
            // Reset the input and suggestions
            if (input) input.value = '';
            if (suggestionsDiv) {
                suggestionsDiv.innerHTML = '';
                suggestionsDiv.style.display = 'none';
            }
        } else if (resp.status === 409) {
            // Duplicate tag—do nothing, or show a message
        } else {
            // Show error
        }

    }

    function getTagUIMarkup(msgId, tags = []) {
        // msgId: the ID of the message from the backend (or blank if unknown)
        // tags: array of {id, name} (empty array for a new message)
        let pills = tags.map(tag => `
        <span class="tag-pill" data-tag-id="${tag.id}">
            ${tag.name}
            <span class="remove-tag" title="Remove tag">&times;</span>
        </span>
    `).join('');
        return `
        <div class="tag-list">
            ${pills}
            <span class="add-tag-btn" title="Add tag">+</span>
        </div>
        <input class="tag-input" type="text" placeholder="Add tag..." style="display:none;">
        <div class="tag-suggestions" style="display:none;"></div>
    `;
    }
    function isMsgIdValid(id) {
        return /^\d+$/.test(id);
    }

    function bindTagInput(input) {
        const msgDiv = input.closest('[data-msg-id]');
        const suggestionsDiv = msgDiv.querySelector('.tag-suggestions');
        let suggestionIdx = -1;

        // Helper: Highlight active suggestion
        function highlightSuggestion(idx) {
            const suggestions = suggestionsDiv.querySelectorAll('.tag-suggestion-item');
            suggestions.forEach((item, i) => {
                item.classList.toggle('active', i === idx);
            });
        }

        input.addEventListener('input', async function () {
            const q = input.value;
            suggestionIdx = -1; // Reset whenever text changes
            if (!q) {
                suggestionsDiv.style.display = 'none';
                suggestionsDiv.innerHTML = '';
                return;
            }
            const resp = await fetch(`/tags?q=${encodeURIComponent(q)}`);
            const tags = await resp.json();
            suggestionsDiv.innerHTML = '';
            if (tags.length === 0) {
                suggestionsDiv.style.display = 'none';
                return;
            }
            tags.forEach((tag, idx) => {
                const item = document.createElement('div');
                item.className = 'tag-suggestion-item';
                item.textContent = tag.name;
                item.tabIndex = -1; // allow focus (not strictly needed)
                item.addEventListener('mousedown', async (e) => {
                    // mousedown instead of click to avoid losing focus before handler
                    e.preventDefault();
                    await addTagToMessage(msgDiv, tag.name, input, suggestionsDiv);
                });
                suggestionsDiv.appendChild(item);
            });
            suggestionsDiv.style.display = 'block';
        });

        input.addEventListener('keydown', async function (e) {
            const suggestions = suggestionsDiv.querySelectorAll('.tag-suggestion-item');
            if ((e.key === 'ArrowDown' || e.key === 'Tab') && suggestions.length > 0) {
                e.preventDefault();
                suggestionIdx = (suggestionIdx + 1) % suggestions.length;
                highlightSuggestion(suggestionIdx);
                input.value = suggestions[suggestionIdx].textContent;
            } else if (e.key === 'ArrowUp' && suggestions.length > 0) {
                e.preventDefault();
                suggestionIdx = (suggestionIdx - 1 + suggestions.length) % suggestions.length;
                highlightSuggestion(suggestionIdx);
                input.value = suggestions[suggestionIdx].textContent;
            } else if (e.key === 'Enter') {
                if (suggestionIdx >= 0 && suggestions[suggestionIdx]) {
                    e.preventDefault();
                    await addTagToMessage(msgDiv, suggestions[suggestionIdx].textContent, input, suggestionsDiv);
                    suggestionIdx = -1;
                } else if (input.value.trim()) {
                    e.preventDefault();
                    await addTagToMessage(msgDiv, input.value.trim(), input, suggestionsDiv);
                    suggestionIdx = -1;
                }
            } else if (e.key === 'Escape') {
                suggestionsDiv.style.display = 'none';
                suggestionsDiv.innerHTML = '';
                suggestionIdx = -1;
            }
        });
    }




    // On initial page load:
    document.querySelectorAll('.tag-input').forEach(bindTagInput);


</script>

{% endblock %}
