<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block header %}
    <title>Syvrona</title>
    <meta name="description" content="Syvrona: Your personal AI companion for creative and technical chat.">
    <link rel="canonical" href="https://syvrona.com/" />
    {% endblock %}


    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/typography.css') }}">

</head>

<body class="bg-light">
    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="container">
            <img src="{{ url_for('static', filename='images/syvrona-logo-darktext-transparent-100.png') }}"
                alt="Syvrona AI Chat Logo" class="logo-image">

            <!-- Hamburger button -->
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
                ☰
            </button>

            <!-- Nav links -->
            <nav class="nav-links" id="navLinks">
                <a href="{{ url_for('main.index') }}">Home</a>
                {% if current_user.is_authenticated %}
                <a href="{{ url_for('main.new_chat') }}">Chat</a>
                <a href="{{ url_for('main.conversations') }}">Conversations</a>
                <a href="{{ url_for('main.profile') }}">Profile</a>
                <a href="{{ url_for('auth.logout') }}">Logout</a>
                {% else %}
                <a href="{{ url_for('auth.login') }}">Login</a>
                <a href="{{ url_for('auth.signup') }}">Sign Up</a>
                {% endif %}
            </nav>
        </div>
    </header>

    {% block content %}
    {% endblock %}
    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2025 Termondt Tech. All rights reserved.</p>
            <p>
                <a href="/privacy" class="footer-link">Privacy Policy</a>
                &nbsp;|&nbsp;
                <a href="/terms" class="footer-link">Terms of Service</a>
            </p>
        </div>
    </footer>




    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('open');
        });
    </script>

</body>

</html>
