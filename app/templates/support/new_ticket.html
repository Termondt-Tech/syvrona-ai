{% extends "base.html" %}

{% block header %}
<title>Submit Support Ticket – Syvrona</title>
<meta name="description"
    content="Contact Syvrona support. Submit a support or feature request and get a personal response.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="{{ url_for('static', filename='css/support.css') }}">
{% endblock %}

{% block content %}
<main class="form-container">
    <h1 class="form-title">Submit a Support Ticket</h1>
    {% include "_flash.html" %}

    <form method="POST" action="{{ url_for('support.submit_ticket') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="type">Type</label>
            <select name="type" id="type" required class="form-control">
                <option value="support">Support Request</option>
                <option value="feature">Feature Request</option>
            </select>
        </div>
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" name="subject" id="subject" maxlength="255" required placeholder="Brief summary"
                class="form-control">
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea name="message" id="message" rows="7" required placeholder="Describe your issue or request"
                class="support-textarea"></textarea>
        </div>
        <div class="form-actions">
            <button class="btn-primary" type="submit">Submit Ticket</button>
        </div>
    </form>
</main>
{% endblock %}
