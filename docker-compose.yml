services:
  web:
    build: .
    env_file:
      - .env
    ports:
      - 5001:5000
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://localhost:5000/healthz').getcode() == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  mysql:
    image: mysql:8.0
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-conf:/etc/mysql/conf.d:ro # ➊ mount custom MySQL config
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  redis:                         # ➋ Redis is now a first-class service
    image: redis:8
    restart: always
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # disable RDB saves (ephemeral rate-limit store)
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
  test:
    build: .
    command: pytest
    environment:
      FLASK_ENV: testing
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "test_secret_key"

volumes:
  mysql_data:
  redis-data:
